<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030304" />
    <title>Sai Gireesh — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Entry gate: browsers only allow sound after a user gesture -->
    <div id="gate" class="gate">
      <p class="mono gate__boot">// sound on for the full experience 🎧</p>
      <button id="enter" class="btn" type="button">Enter</button>
    </div>

    <!-- Slides in from the side once the glass arrives -->
    <section id="message" class="message" aria-live="polite">
      <p class="mono message__kicker">// a quick pause</p>
      <h1 class="message__title">
        <span class="line" data-split>You have been screening</span>
        <span class="line" data-split>a lot of portfolios so far.</span>
      </h1>
      <p class="message__sub">
        <span class="line" data-split>You deserve a break —</span>
        <span class="line line--accent" data-split>have this glass of water.</span>
      </p>
    </section>

    <button id="mute" class="mute" type="button" aria-label="Mute sound" hidden>
      <span class="mute__icon" aria-hidden="true">♪</span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
