<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030304" />
    <title>Sai Gireesh Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Entry gate: browsers only allow sound after a user gesture -->
    <div id="gate" class="gate">
      <p class="mono gate__boot">// sound on for the full experience 🎧</p>
      <button id="enter" class="btn" type="button">Enter</button>
    </div>

    <!-- Slides in from the side once the glass arrives -->
    <section id="message" class="message" aria-live="polite">
      <p class="mono message__kicker">// a quick pause</p>
      <h1 class="message__title">
        <span class="line" data-split>You have been screening</span>
        <span class="line" data-split>a lot of portfolios so far.</span>
      </h1>
      <p class="message__sub">
        <span class="line" data-split>You deserve a break —</span>
        <span class="line line--accent" data-split>have this glass of water.</span>
      </p>
    </section>

    <section id="message-refreshed" class="message" aria-live="polite">
      <p class="mono message__kicker">// refreshed</p>
      <h1 class="message__title">
        <span class="line" data-split>Feeling better?</span>
      </h1>
      <p class="message__sub">
        <span class="line" data-split>Good. Now let me tell you</span>
        <span class="line line--accent" data-split>a little about myself.</span>
      </p>
    </section>

    <!-- Know about me: progress across the five boxes -->
    <div id="progress" class="progress" aria-live="polite">
      <div class="progress__dots" aria-hidden="true">
        <span class="progress__dot"></span><span class="progress__dot"></span><span class="progress__dot"></span><span class="progress__dot"></span><span class="progress__dot"></span>
      </div>
      <p class="progress__text">Pull a card out of a box to read that chapter</p>
    </div>
    <!-- Keyboard / screen-reader access to the cards -->
    <nav id="chapter-nav" class="sr-only" aria-label="Chapters"></nav>

    <!-- A pulled card, readable -->
    <div id="chapter" class="chapter" role="dialog" aria-modal="true" aria-labelledby="chapter-title" hidden>
      <article class="chapter__card">
        <button class="chapter__close" type="button" aria-label="Close chapter">✕</button>
        <div class="chapter__head">
          <p class="chapter__num"></p>
          <p class="chapter__kicker"></p>
        </div>
        <h2 id="chapter-title" class="chapter__title"></h2>
        <p class="chapter__body"></p>
        <ul class="chapter__chips" hidden></ul>
        <p class="chapter__note" hidden></p>
        <div class="chapter__actions">
          <button class="chapter__next" type="button">Next chapter</button>
        </div>
      </article>
    </div>

    <!-- Closing lines -->
    <section id="panel" class="panel" aria-live="polite">
      <p class="mono panel__kicker"></p>
      <h2 class="panel__title"></h2>
      <p class="panel__body"></p>
    </section>

    <button id="drink" class="btn drink" type="button" hidden>
      <span class="drink__icon" aria-hidden="true"></span>
      <span class="drink__label">Drink the water</span>
    </button>

    <button id="mute" class="mute" type="button" aria-label="Mute sound" hidden>
      <span class="mute__icon" aria-hidden="true">♪</span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
